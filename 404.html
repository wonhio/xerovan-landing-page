<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page not found | Xerovan</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="/images/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  :root{--void:#0a0b0d;--panel:#131417;--line:#232529;--silver-100:#f6f7f9;--silver-300:#d4d7dc;--silver-500:#9ba0a8;--ice:#8fe3ee;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--void);color:var(--silver-100);font-family:'Inter','Noto Sans KR','Noto Sans JP','Noto Sans Arabic',sans-serif;min-height:100vh;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}
  header{padding:18px 32px;border-bottom:1px solid var(--line)}
  header img{height:22px}
  main{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;padding:60px 20px;
    background:radial-gradient(ellipse 60% 45% at 50% 30%, rgba(143,227,238,0.07), transparent 70%)}
  .code{font-family:'JetBrains Mono',monospace;font-size:13px;letter-spacing:.3em;color:var(--ice);margin-bottom:18px}
  h1{font-family:'Unbounded','Noto Sans KR','Noto Sans JP','Noto Sans Arabic',sans-serif;font-weight:700;font-size:clamp(28px,5vw,48px);line-height:1.15;
    background:linear-gradient(100deg,#9ba0a8 0%,#f6f7f9 30%,#fff 45%,#d4d7dc 60%,#9ba0a8 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
  p{color:var(--silver-500);font-size:16px;line-height:1.65;margin:18px auto 36px;max-width:460px}
  .actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
  .btn{font-family:'Unbounded','Noto Sans KR','Noto Sans JP','Noto Sans Arabic',sans-serif;font-size:13px;font-weight:600;padding:15px 26px;border-radius:100px;border:1px solid var(--line);color:var(--silver-300)}
  .btn:hover{border-color:var(--silver-500);color:var(--silver-100)}
  .btn.primary{background:linear-gradient(180deg,#fff 0%,#e2e6ea 35%,#b7bec4 60%,#eef1f3 100%);color:#0a0b0d;border:none}
</style>
</head>
<body>
<header><a href="/" id="home"><img src="/images/logo-wordmark.png" alt="XEROVAN"></a></header>
<main>
  <div>
    <div class="code">404</div>
    <h1 id="t">This page doesn't exist.</h1>
    <p id="d">The link may be broken, or the page may have moved. Try one of these instead.</p>
    <div class="actions">
      <a class="btn primary" id="a1" href="/en/">Go to homepage</a>
      <a class="btn" id="a2" href="/en/blog">Read the blog</a>
      <a class="btn" id="a3" href="/en/#waitlist">Join the waitlist</a>
    </div>
  </div>
</main>
<script>
  // Show the page in the language of the URL the visitor tried (/kr/..., /ja/...), else English.
  (function () {
    var T = {
      en: ["This page doesn't exist.", "The link may be broken, or the page may have moved. Try one of these instead.", "Go to homepage", "Read the blog", "Join the waitlist"],
      kr: ["페이지를 찾을 수 없습니다.", "링크가 잘못되었거나 페이지가 이동했을 수 있습니다. 아래에서 이동해 보세요.", "홈으로", "블로그 보기", "대기자 명단 등록"],
      ja: ["ページが見つかりません。", "リンクが壊れているか、ページが移動した可能性があります。こちらからお進みください。", "ホームへ", "ブログを読む", "ウェイトリストに登録"],
      es: ["Esta página no existe.", "Es posible que el enlace esté roto o que la página se haya movido. Prueba una de estas opciones.", "Ir al inicio", "Leer el blog", "Únete a la lista de espera"],
      ar: ["هذه الصفحة غير موجودة.", "ربما يكون الرابط معطلًا أو نُقلت الصفحة. جرّب أحد الخيارات التالية.", "الصفحة الرئيسية", "اقرأ المدونة", "انضم إلى قائمة الانتظار"],
      pt: ["Esta página não existe.", "O link pode estar quebrado ou a página pode ter mudado de lugar. Tente uma destas opções.", "Ir para o início", "Ler o blog", "Entrar na lista de espera"]
    };
    var HL = { en: "en", kr: "ko", ja: "ja", es: "es", ar: "ar", pt: "pt" };
    var seg = (location.pathname.split("/")[1] || "").toLowerCase();
    var lang = T[seg] ? seg : "en", t = T[lang];
    document.documentElement.lang = HL[lang];
    if (lang === "ar") document.documentElement.dir = "rtl";
    if (lang === "kr") document.body.style.wordBreak = "keep-all";
    document.title = t[0].replace(/[.。]$/, "") + " | Xerovan";
    document.getElementById("t").textContent = t[0];
    document.getElementById("d").textContent = t[1];
    var a1 = document.getElementById("a1"), a2 = document.getElementById("a2"), a3 = document.getElementById("a3");
    a1.textContent = t[2]; a1.href = "/" + lang + "/";
    a2.textContent = t[3]; a2.href = "/" + lang + "/blog";
    a3.textContent = t[4]; a3.href = "/" + lang + "/#waitlist";
    document.getElementById("home").href = "/" + lang + "/";
  })();
</script>
</body>
</html>
