<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Xerovan — Value in Motion</title>
<meta name="robots" content="noindex">
<link rel="canonical" href="https://www.xerovan.com/en/">
<!-- Normally never served: vercel.json redirects "/" to the visitor's language first.
     This is only a fallback (e.g. local preview without Vercel). -->
<script>
  (function () {
    var supported = ['en', 'kr', 'ja', 'es', 'ar', 'pt'];
    var m = document.cookie.match(/(?:^|; )xv_lang=([a-z]+)/);
    var lang = m && supported.indexOf(m[1]) > -1 ? m[1] : null;
    if (!lang) {
      var nav = (navigator.language || 'en').toLowerCase().slice(0, 2);
      lang = nav === 'ko' ? 'kr' : (supported.indexOf(nav) > -1 ? nav : 'en');
    }
    location.replace('/' + lang + '/');
  })();
</script>
<noscript><meta http-equiv="refresh" content="0; url=/en/"></noscript>
</head>
<body style="background:#0a0b0d"></body>
</html>
